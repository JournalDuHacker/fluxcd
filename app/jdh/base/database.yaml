---
apiVersion: k8s.mariadb.com/v1alpha1
kind: MariaDB
metadata:
  name: mariadb-jdh
spec:
  database: jdh
  username: jdh

  storage:
    size: 10Gi
    storageClassName: rbd-databases-1az

  env:
    # Since data were imported from replication, we need to keep the same
    # host-timezone than the source.
    - name: TZ
      value: "Europe/Paris"

  metrics:
    enabled: true

  # common config
  volumes:
    - name: mariadb-config-project
      configMap:
        name: mariadb-config-project
  volumeMounts:
    - name: mariadb-config-project
      mountPath: /etc/mysql/mariadb.conf.d/project.cnf
      subPath: project.cnf

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - topologyKey: topology.kubernetes.io/zone
          labelSelector:
            matchLabels:
              app.kubernetes.io/instance: mariadb-jdh

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      memory: 2Gi

  # innodb_buffer_pool_size: 78% of memory limits (1600MB/2048MB).
  myCnf: |
    [mariadb]
    innodb_buffer_pool_size=1600MB
